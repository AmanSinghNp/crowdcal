[project]
name = "crowdcal"
version = "0.1.0"
description = "Does 70% mean 70% of people agree? Calibration benchmark for typed decision models against human label distributions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
local = ["torch>=2.4", "transformers>=4.48"]

[project.scripts]
crowdcal = "crowdcal.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
